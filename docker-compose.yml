services:
  backend:
    build:
      context: ./pipelinegraph
    container_name: pipelinegraph-backend
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: http://localhost:8080
    container_name: pipelinegraph-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
